name: EnvSync Validation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test
        working-directory: backend
      - name: EnvSync Validation   # exit 1 on critical errors; prints names only, never values
        run: node backend/bin/envsync.js check --dir .envsync
  deploy:
    needs: validate          # skipped automatically if validation fails
    runs-on: ubuntu-latest
    steps:
      - run: echo "Validation passed - continue deployment"
